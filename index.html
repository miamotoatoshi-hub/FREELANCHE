<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Freelanche</title>
    <meta name="description" content="A calm, offline-first income tracker for freelancers. No account, no ads." />
    <meta name="theme-color" content="#f5f5f2" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Freelanche" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Applies a saved light/dark choice before first paint, so there is no flash. -->
    <script src="/theme-init.js"></script>
    <style>
      html,
      body {
        margin: 0;
        background: #f5f5f2;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme='light']),
        :root:not([data-theme='light']) body {
          background: #0e0f12;
        }
      }
      :root[data-theme='dark'],
      :root[data-theme='dark'] body {
        background: #0e0f12;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
      }
      #boot svg {
        width: 72px;
        height: 72px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot" aria-hidden="true">
      <svg viewBox="0 0 96 96">
        <rect width="96" height="96" rx="26" fill="#3b5bdb" />
        <path d="M22 66 40 48l12 11 22-25" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="74" cy="34" r="6.5" fill="#fff" />
      </svg>
    </div>
    <noscript>Freelanche needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
