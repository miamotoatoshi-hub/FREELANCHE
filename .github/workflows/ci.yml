name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/scan-secrets.sh
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:release
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results
            playwright-report

  # A real Android build on GitHub's servers (they ship the Android SDK): compiles the app including the native
  # billing plugin, and runs the native unit tests. It builds the *debug* app, so no signing key or licence key is needed.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Compile the app and run the native unit tests
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: A release build must refuse to run without the Play licence key
        working-directory: android
        run: |
          if env -u FREELANCHE_PLAY_LICENSE_KEY ./gradlew --no-daemon bundleRelease > "$RUNNER_TEMP/nokey.log" 2>&1; then
            echo "::error::A release bundle was built without a Play licence key — the guard is broken."; exit 1
          fi
          grep -q "Missing the Google Play licence key" "$RUNNER_TEMP/nokey.log" || { echo "::error::It failed, but not for the expected reason:"; tail -30 "$RUNNER_TEMP/nokey.log"; exit 1; }
          echo "Good: the release build refused to run without a licence key."
      - name: Rehearse the signed release bundle (a throwaway key is made here, nothing is kept or uploaded)
        working-directory: android
        run: |
          set -e
          KS="$RUNNER_TEMP/rehearsal.jks"
          export FREELANCHE_UPLOAD_STORE_PASSWORD="rehearsal-$(openssl rand -hex 12)"
          export FREELANCHE_UPLOAD_KEY_PASSWORD="$FREELANCHE_UPLOAD_STORE_PASSWORD"
          export FREELANCHE_UPLOAD_KEY_ALIAS=rehearsal
          export FREELANCHE_UPLOAD_STORE_FILE="$KS"
          keytool -genkeypair -keystore "$KS" -alias rehearsal -keyalg RSA -keysize 2048 -validity 2 -dname "CN=rehearsal" \
            -storepass:env FREELANCHE_UPLOAD_STORE_PASSWORD -keypass:env FREELANCHE_UPLOAD_KEY_PASSWORD > /dev/null
          # any valid RSA public key satisfies the build's format check; this one is a dummy
          export FREELANCHE_PLAY_LICENSE_KEY="$(openssl genrsa 2048 2>/dev/null | openssl rsa -pubout -outform DER 2>/dev/null | base64 -w0)"
          ./gradlew --no-daemon testReleaseUnitTest bundleRelease
          ls -la app/build/outputs/bundle/release/
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab | head -2
          rm -f "$KS"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            android/app/build/reports
            android/app/build/test-results
