name: Android bundle (manual)

# Builds the SIGNED release bundle (.aab) you upload to Google Play. It never uploads anything to Google Play itself.
# Run it from the Actions tab → "Android bundle (manual)" → Run workflow.
#
# It needs five repository secrets (Settings → Secrets and variables → Actions). Secrets cannot be read back once saved.
#   UPLOAD_KEYSTORE_BASE64  your upload key file (.jks), turned into text with base64
#   UPLOAD_STORE_PASSWORD   the key file password
#   UPLOAD_KEY_ALIAS        normally: upload
#   UPLOAD_KEY_PASSWORD     the key password
#   PLAY_LICENSE_KEY        the PUBLIC licence key from Play Console (Monetize with Play → Monetization setup → Licensing)
# See docs/PLAY_CONSOLE_CHECKLIST.md, Part F.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the five secrets exist (values are never printed)
        env:
          K1: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          K2: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          K3: ${{ secrets.UPLOAD_KEY_ALIAS }}
          K4: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          K5: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          missing=""
          [ -n "$K1" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$K2" ] || missing="$missing UPLOAD_STORE_PASSWORD"
          [ -n "$K3" ] || missing="$missing UPLOAD_KEY_ALIAS"
          [ -n "$K4" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          [ -n "$K5" ] || missing="$missing PLAY_LICENSE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing — see docs/PLAY_CONSOLE_CHECKLIST.md, Part F."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run android:sync

      - name: Build the signed bundle
        working-directory: android
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          FREELANCHE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FREELANCHE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FREELANCHE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          FREELANCHE_PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export FREELANCHE_UPLOAD_STORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon testReleaseUnitTest bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Check the bundle is signed
        run: jarsigner -verify -certs android/app/build/outputs/bundle/release/app-release.aab | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: freelanche-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 14
