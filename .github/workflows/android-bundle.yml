name: Android bundle (manual)

# Builds the SIGNED release bundle (.aab) that you upload to Google Play (Internal testing first).
# It never uploads anything to Google Play and never publishes a release - you do that yourself in Play Console.
# Run it from the Actions tab → "Android bundle (manual)" → Run workflow.
#
# It needs FIVE repository secrets (Settings → Secrets and variables → Actions). Secrets cannot be read back once saved.
# All five are mandatory: without any one of them there is no valid signed bundle, and the workflow stops at the first
# step with a message naming what is missing. There is deliberately no unsigned or "test key" fallback here.
#
#   UPLOAD_KEYSTORE_BASE64  your upload key file (.jks), turned into one line of text with base64    → signs the bundle
#   UPLOAD_STORE_PASSWORD   the password of that key file                                              → opens the key file
#   UPLOAD_KEY_ALIAS        the key's name inside the file, normally: upload                           → picks the key
#   UPLOAD_KEY_PASSWORD     the key's password. For a normal key file it is the SAME as the store password
#   PLAY_LICENSE_KEY        the PUBLIC licence key from Play Console (Monetize with Play → Monetization
#                           setup → Licensing). It is not a secret, but the release build refuses to build
#                           without it, because the app uses it to reject forged purchases.
#
# Before the long build, scripts/check-signing-inputs.sh proves the key file opens, the alias exists, the password
# signs, and the licence key is well-formed. After the build, scripts/verify-signed-bundle.sh proves the .aab is a real
# bundle signed by exactly that key. Neither script prints a password or a key.
# Step-by-step instructions: docs/PLAY_CONSOLE_CHECKLIST.md, Parts E and F.

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: >-
          Optional. Google Play needs a higher "version code" for every upload. Leave empty to use the number from
          package.json (1.2.0 becomes 10200). To upload a second build of the same version, type a bigger whole number.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Check the version code (if you typed one)
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          # Where the upload key file is unpacked for the duration of this job. Only a file name - not a secret.
          echo "FREELANCHE_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          if [ -n "$VERSION_CODE" ]; then
            if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]{0,9}$ ]] || [ "$VERSION_CODE" -gt 2100000000 ]; then
              echo "::error::The version code must be a whole number from 1 to 2100000000 (Google Play's limit). Leave it empty to use the number from package.json."
              exit 1
            fi
          fi

      - name: Check the five secrets exist (values are never printed)
        env:
          K1: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          K2: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          K3: ${{ secrets.UPLOAD_KEY_ALIAS }}
          K4: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          K5: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          missing=""
          [ -n "$K1" ] || missing="$missing UPLOAD_KEYSTORE_BASE64"
          [ -n "$K2" ] || missing="$missing UPLOAD_STORE_PASSWORD"
          [ -n "$K3" ] || missing="$missing UPLOAD_KEY_ALIAS"
          [ -n "$K4" ] || missing="$missing UPLOAD_KEY_PASSWORD"
          [ -n "$K5" ] || missing="$missing PLAY_LICENSE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing - add them under Settings > Secrets and variables > Actions, then run this workflow again. Instructions: docs/PLAY_CONSOLE_CHECKLIST.md, Parts E and F."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Unpack the upload key and check it before building
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          FREELANCHE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FREELANCHE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FREELANCHE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          FREELANCHE_PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
        run: |
          umask 077
          if ! printf '%s' "$UPLOAD_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$FREELANCHE_UPLOAD_STORE_FILE" 2>/dev/null; then
            echo "::error::UPLOAD_KEYSTORE_BASE64 is not valid base64 text. Make it again from your .jks file (docs/PLAY_CONSOLE_CHECKLIST.md, Part F) and paste all of it."
            exit 1
          fi
          bash scripts/check-signing-inputs.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci
      - run: npm test
      - run: npm run android:sync

      - name: Build the signed bundle
        working-directory: android
        env:
          FREELANCHE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FREELANCHE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          FREELANCHE_UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          FREELANCHE_PLAY_LICENSE_KEY: ${{ secrets.PLAY_LICENSE_KEY }}
          FREELANCHE_VERSION_CODE: ${{ inputs.version_code }}
        run: ./gradlew --no-daemon testReleaseUnitTest bundleRelease

      - name: Check the bundle is signed with your upload key
        env:
          FREELANCHE_UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          FREELANCHE_UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
        run: bash scripts/verify-signed-bundle.sh android/app/build/outputs/bundle/release/app-release.aab

      - name: Write the summary
        env:
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          read -r name code < <(node -e '
            const version = require("./package.json").version;
            const [major, minor, patch] = version.split(".").map(Number);
            console.log(version, process.env.VERSION_CODE || String(major * 10000 + minor * 100 + patch));
          ')
          {
            echo "### Signed bundle ready"
            echo "- App version: **$name** · version code: **$code**"
            echo "- Download it from **Artifacts → freelanche-release** at the bottom of this page, unzip it, and you get \`app-release.aab\`."
            echo
            echo "**Next (you do this by hand - this workflow publishes nothing):**"
            echo "1. Play Console → your app → Testing → **Internal testing** → Create new release → upload \`app-release.aab\`."
            echo "2. Google needs a higher version code for every upload. To upload again, run this workflow with a bigger number in **version_code**."
            echo "3. Do not promote to Production until the real-purchase test in docs/TESTING.md has passed on a phone."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: freelanche-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 14

      - name: Remove the unpacked key file
        if: always()
        run: rm -f "$FREELANCHE_UPLOAD_STORE_FILE"
