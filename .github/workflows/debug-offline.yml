name: Debug offline (temporary)
on:
  push:
    branches: [claude/freelance-income-tracker-app-1xp7xq]
    paths: ['.github/workflows/debug-offline.yml', 'e2e/zz-debug-offline.spec.ts']
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test e2e/zz-debug-offline.spec.ts --reporter=list
        env: { DEBUG_OFFLINE: '1' }
